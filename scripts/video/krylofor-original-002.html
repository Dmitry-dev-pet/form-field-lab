<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Form / Field Original 002 — Krylofor</title>
  <style>
    :root {
      color-scheme: dark;
      --film-background: #070707;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--film-background);
    }

    body { display: grid; place-items: center; }

    canvas {
      display: block;
      width: min(100vw, 56.25vh);
      height: min(177.7778vw, 100vh);
      background: var(--film-background);
    }

    #download {
      position: fixed;
      right: 12px;
      bottom: 12px;
      opacity: 0;
      pointer-events: none;
    }

    #download.ready { pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="film" width="1080" height="1920" aria-label="Krylofor: four complete wingbeats in 280 characters"></canvas>
  <a id="download" download="krylofor-original-002.webm">DOWNLOAD WEBM</a>

  <script type="module">
    import {
      KRYLOFOR_GENOME,
      KRYLOFOR_GENOME_CHARACTERS
    } from "../../src/data/kryloforGenome.js";

    const WIDTH = 1080;
    const HEIGHT = 1920;
    const FPS = 30;
    const TOTAL_FRAMES = 450;
    const MOTION_START = 60;
    const MOTION_END = MOTION_START + 314;
    const SAFE = Object.freeze({ x: 120, y: 240, width: 660, height: 1020 });
    const PALETTE = Object.freeze({
      background: "#070707",
      paper: "#f5f0e8",
      quiet: "#c8c1cf",
      violet: "#b8a5ff",
      ultraviolet: "#ff51e1"
    });
    const code = KRYLOFOR_GENOME;
    const codeLines = Array.from({ length: Math.ceil(code.length / 28) }, (_, index) => (
      code.slice(index * 28, index * 28 + 28)
    ));

    if (KRYLOFOR_GENOME_CHARACTERS !== 280 || code.length !== 280 || codeLines.join("") !== code) {
      throw new Error("Krylofor drifted from its 280-character autonomous root.");
    }

    const canvas = document.querySelector("#film");
    const output = canvas.getContext("2d", { alpha: false });
    const sceneCanvas = document.createElement("canvas");
    sceneCanvas.width = WIDTH;
    sceneCanvas.height = HEIGHT;
    const context = sceneCanvas.getContext("2d", { alpha: false });
    const download = document.querySelector("#download");
    const query = new URLSearchParams(location.search);

    window.__videoReady = false;
    window.__videoMetadata = {
      fps: FPS,
      frames: TOTAL_FRAMES,
      width: WIDTH,
      height: HEIGHT,
      genomeLength: code.length,
      genomeLimit: 280,
      entity: "krylofor",
      wingbeats: 4,
      rawTimeStep: 0.01,
      rawOrbitRadians: Math.PI,
      safeZone: SAFE
    };

    function clamp(value, minimum = 0, maximum = 1) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function mix(from, to, amount) {
      return from + (to - from) * amount;
    }

    function smoothstep(from, to, value) {
      const amount = clamp((value - from) / (to - from));
      return amount * amount * (3 - 2 * amount);
    }

    function fadeRange(frame, start, end, edge = 14) {
      return smoothstep(start, start + edge, frame) * (1 - smoothstep(end - edge, end, frame));
    }

    function trackedText(value, x, y, size, color, options = {}) {
      context.save();
      context.globalAlpha *= options.alpha ?? 1;
      context.fillStyle = color;
      context.font = `${options.style || "normal"} ${options.weight || 500} ${size}px ${options.family || '"Avenir Next Condensed", "Arial Narrow", sans-serif'}`;
      context.textAlign = options.align || "left";
      context.textBaseline = options.baseline || "alphabetic";

      if (!options.tracking) {
        context.fillText(value, x, y);
      } else {
        let cursor = x;
        for (const glyph of [...value]) {
          context.fillText(glyph, cursor, y);
          cursor += context.measureText(glyph).width + options.tracking;
        }
      }
      context.restore();
    }

    function drawCodePlate(alpha, split) {
      if (alpha <= 0) return;
      context.save();
      context.globalAlpha = alpha;

      trackedText("FORM / FIELD", SAFE.x, 294, 46, PALETTE.ultraviolet, {
        weight: 700,
        tracking: 2.8
      });
      trackedText("ORIGINAL 002", SAFE.x, 352, 46, PALETTE.quiet, {
        weight: 500,
        tracking: 2.1
      });

      trackedText("280", SAFE.x, 488, 160, PALETTE.paper, {
        family: '"Iowan Old Style", Georgia, serif',
        weight: 600
      });
      trackedText("/ 280", SAFE.x + 300, 482, 58, PALETTE.ultraviolet, {
        family: '"SFMono-Regular", Menlo, monospace',
        weight: 500
      });

      codeLines.forEach((line, index) => {
        const direction = index % 2 ? 1 : -1;
        trackedText(line, SAFE.x + direction * split * 150, 556 + index * 50, 38, index === codeLines.length - 1 ? PALETTE.ultraviolet : PALETTE.quiet, {
          family: '"SFMono-Regular", Menlo, monospace',
          weight: 400
        });
      });

      trackedText("FOUR COMPLETE WINGBEATS", SAFE.x, 1100, 46, PALETTE.paper, {
        weight: 600,
        tracking: 0.9
      });
      trackedText("KRYLOFOR", SAFE.x, 1190, 74, PALETTE.violet, {
        family: '"Iowan Old Style", Georgia, serif',
        style: "italic",
        weight: 500
      });
      context.restore();
    }

    function drawKrylofor(frameIndex, visibility, collapse) {
      if (visibility <= 0) return;
      const motionFrame = clamp(frameIndex - MOTION_START + 1, 1, MOTION_END - MOTION_START);
      const rawTime = motionFrame * 0.01;
      const cosOrbit = Math.cos(rawTime);
      const sinOrbit = Math.sin(rawTime);
      const scale = 3.25;
      const centerX = 536;
      const centerY = 925;

      const glow = context.createRadialGradient(centerX, centerY, 30, centerX, centerY, 620);
      glow.addColorStop(0, `rgba(175,65,255,${0.09 * visibility})`);
      glow.addColorStop(0.45, `rgba(68,40,150,${0.045 * visibility})`);
      glow.addColorStop(1, "rgba(0,0,0,0)");
      context.fillStyle = glow;
      context.fillRect(0, 210, WIDTH, 1430);

      context.save();
      context.globalAlpha = visibility;
      context.globalCompositeOperation = "screen";

      for (let index = 10000; index--;) {
        const u = index / 2000;
        const v = (index % 99 / 49 - 1) ** 3;
        const profile = Math.sin(u / 1.6);
        const wave = Math.sin(8 * rawTime - u * 2);
        const sourceX = (u - 2) * 50;
        const sourceZ = profile * (15 * Math.sin(3 * v) + 20 * wave * (1 - v * v));
        const sourceY = v * profile * (30 + 80 * profile + wave) + u * u * wave;
        const rawX = sourceX * cosOrbit + sourceZ * sinOrbit;

        // A fixed quarter-turn makes the long RAW axis portrait-oriented.
        // The changing orbit and every deformation above remain in the genome.
        const portraitX = mix(sourceY, 0, collapse);
        const portraitY = -rawX * mix(1, 0.42, collapse);
        const x = centerX + portraitX * scale;
        const y = centerY + portraitY * scale;
        const signal = Math.sin(9 * rawTime - u * 3) ** 8;
        const red = Math.round(255 * signal);

        context.fillStyle = `rgba(${red},8,255,0.31)`;
        const size = 2.35 + 0.7 * signal;
        context.fillRect(x, y, size, size);
      }
      context.restore();
    }

    function drawStatement(alpha) {
      if (alpha <= 0) return;
      context.save();
      context.globalAlpha = alpha;
      trackedText("KRYLOFOR", SAFE.x, 356, 84, PALETTE.violet, {
        family: '"Iowan Old Style", Georgia, serif',
        style: "italic",
        weight: 500
      });
      trackedText("280", SAFE.x, 684, 260, PALETTE.paper, {
        family: '"Iowan Old Style", Georgia, serif',
        weight: 600
      });
      trackedText("CHARACTERS", SAFE.x, 770, 60, PALETTE.ultraviolet, {
        weight: 700,
        tracking: 2.2
      });
      trackedText("LEARN", SAFE.x, 960, 74, PALETTE.paper, {
        weight: 600,
        tracking: 1.3
      });
      trackedText("TO FLY", SAFE.x, 1044, 74, PALETTE.paper, {
        weight: 600,
        tracking: 1.3
      });
      trackedText("FORM / FIELD ORIGINAL 002", SAFE.x, 1180, 46, PALETTE.ultraviolet, {
        weight: 700,
        tracking: 1.5
      });
      context.restore();
    }

    function drawSafeZone() {
      context.save();
      context.fillStyle = "rgba(255,70,90,.17)";
      context.fillRect(0, 0, WIDTH, SAFE.y);
      context.fillRect(0, SAFE.y + SAFE.height, WIDTH, HEIGHT - SAFE.y - SAFE.height);
      context.fillRect(0, SAFE.y, SAFE.x, SAFE.height);
      context.fillRect(SAFE.x + SAFE.width, SAFE.y, WIDTH - SAFE.x - SAFE.width, SAFE.height);
      context.strokeStyle = "rgba(255,255,255,.88)";
      context.lineWidth = 3;
      context.strokeRect(SAFE.x, SAFE.y, SAFE.width, SAFE.height);
      trackedText("TIKTOK UI SAFE ZONE", SAFE.x + 16, SAFE.y + 42, 30, "#fff", {
        family: '"SFMono-Regular", Menlo, monospace',
        weight: 700
      });
      context.restore();
    }

    function drawFrame(frameIndex) {
      context.fillStyle = PALETTE.background;
      context.fillRect(0, 0, WIDTH, HEIGHT);

      const organismVisibility = smoothstep(48, 76, frameIndex) * (1 - smoothstep(374, 400, frameIndex));
      const openingFold = 1 - smoothstep(48, 82, frameIndex);
      const closingFold = smoothstep(374, 400, frameIndex);
      drawKrylofor(frameIndex, organismVisibility, Math.max(openingFold, closingFold));

      const openingCode = 1 - smoothstep(40, 70, frameIndex);
      const returningCode = smoothstep(430, 446, frameIndex);
      const codeAlpha = Math.max(openingCode, returningCode);
      const codeSplit = frameIndex < 100
        ? smoothstep(40, 70, frameIndex)
        : 1 - smoothstep(430, 446, frameIndex);
      drawCodePlate(codeAlpha, codeSplit);
      drawStatement(fadeRange(frameIndex, 382, 432, 6));

      if (query.has("safe")) drawSafeZone();
      output.drawImage(sceneCanvas, 0, 0);
    }

    function startRecording() {
      const stream = canvas.captureStream(FPS);
      const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm;codecs=vp8";
      const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 20_000_000
      });
      const chunks = [];
      let frameIndex = 0;
      let tailFrame = 0;
      let expectedTime = performance.now();

      recorder.addEventListener("dataavailable", event => {
        if (event.data.size) chunks.push(event.data);
      });
      recorder.addEventListener("stop", () => {
        const blob = new Blob(chunks, { type: mimeType });
        download.href = URL.createObjectURL(blob);
        download.classList.add("ready");
        window.__videoReady = true;
        window.__videoBlobSize = blob.size;
      });

      recorder.start(1000);

      function tick(now) {
        if (now >= expectedTime) {
          if (frameIndex < TOTAL_FRAMES) {
            drawFrame(frameIndex);
            frameIndex += 1;
          } else if (tailFrame < 30) {
            drawFrame(TOTAL_FRAMES - 1);
            tailFrame += 1;
          }
          expectedTime += 1000 / FPS;
        }
        if (frameIndex >= TOTAL_FRAMES && tailFrame >= 30) {
          recorder.stop();
          return;
        }
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    if (query.has("record")) {
      startRecording();
    } else {
      const previewFrame = Math.min(TOTAL_FRAMES - 1, Number(query.get("frame") || 217));
      drawFrame(previewFrame);
      window.__videoReady = true;
    }
  </script>
</body>
</html>
