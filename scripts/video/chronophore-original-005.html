<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Form / Field Original 005 — Chronophore</title>
  <style>
    @font-face {
      font-family: "FF Barlow Condensed";
      src: url("../../public/fonts/form-field/BarlowCondensed-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: block;
    }

    @font-face {
      font-family: "FF Barlow Condensed";
      src: url("../../public/fonts/form-field/BarlowCondensed-SemiBold.ttf") format("truetype");
      font-style: normal;
      font-weight: 600;
      font-display: block;
    }

    @font-face {
      font-family: "FF Cormorant Garamond";
      src: url("../../public/fonts/form-field/CormorantGaramond-Italic-wght.ttf") format("truetype");
      font-style: italic;
      font-weight: 300 700;
      font-display: block;
    }

    @font-face {
      font-family: "FF IBM Plex Mono";
      src: url("../../public/fonts/form-field/IBMPlexMono-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: block;
    }

    :root {
      color-scheme: dark;
      --film-background: #090711;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--film-background);
    }

    body { display: grid; place-items: center; }

    canvas {
      display: block;
      width: min(100vw, 56.25vh);
      height: min(177.7778vw, 100vh);
      background: var(--film-background);
    }
  </style>
</head>
<body>
  <canvas id="film" width="1080" height="1920" aria-label="Chronophore: 273 characters hold a knot in time"></canvas>

  <script type="module">
    import { CHRONOPHORE_GENOME } from "../../src/data/chronophoreGenome.js";

    const WIDTH = 1080;
    const HEIGHT = 1920;
    const FPS = 30;
    const TOTAL_FRAMES = 450;
    const SAFE = Object.freeze({ x: 120, y: 240, width: 660, height: 1020 });
    const PALETTE = Object.freeze({
      background: "#090711",
      paper: "#f8f3ff",
      quiet: "#b8b1ca",
      phase: "#8ce7ff",
      time: "#f3c979",
      violet: "#d2a7ff"
    });
    const code = CHRONOPHORE_GENOME;
    const codeLines = Array.from({ length: Math.ceil(code.length / 28) }, (_, index) => (
      code.slice(index * 28, index * 28 + 28)
    ));

    if (code.length !== 273 || codeLines.join("") !== code) {
      throw new Error("Chronophore drifted from its 273-character phase knot.");
    }

    const canvas = document.querySelector("#film");
    const context = canvas.getContext("2d", { alpha: false });
    const query = new URLSearchParams(location.search);

    window.__videoReady = false;
    window.__videoMetadata = {
      fps: FPS,
      frames: TOTAL_FRAMES,
      width: WIDTH,
      height: HEIGHT,
      genomeLength: code.length,
      genomeLimit: 280,
      entity: "chronophore",
      particles: 20000,
      winding: [2, 3],
      timeStep: 0.02,
      sourceMechanicsChanged: false,
      safeZone: SAFE
    };

    function clamp(value, minimum = 0, maximum = 1) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function mix(from, to, amount) {
      return from + (to - from) * amount;
    }

    function smoothstep(from, to, value) {
      const amount = clamp((value - from) / (to - from));
      return amount * amount * (3 - 2 * amount);
    }

    function fadeRange(frame, start, end, edge = 14) {
      return smoothstep(start, start + edge, frame) * (1 - smoothstep(end - edge, end, frame));
    }

    function trackedText(value, x, y, size, color, options = {}) {
      context.save();
      context.globalAlpha *= options.alpha ?? 1;
      context.fillStyle = color;
      context.font = `${options.style || "normal"} ${options.weight || 400} ${size}px ${options.family || '"FF Barlow Condensed", sans-serif'}`;
      context.textAlign = options.align || "left";
      context.textBaseline = options.baseline || "alphabetic";

      if (!options.tracking) {
        context.fillText(value, x, y);
      } else {
        let cursor = x;
        for (const glyph of [...value]) {
          context.fillText(glyph, cursor, y);
          cursor += context.measureText(glyph).width + options.tracking;
        }
      }
      context.restore();
    }

    function drawPhaseField(frameIndex, visibility) {
      const centerX = 540;
      const centerY = 930;
      const gradient = context.createRadialGradient(centerX, centerY, 20, centerX, centerY, 760);
      gradient.addColorStop(0, `rgba(116,80,180,${0.14 * visibility})`);
      gradient.addColorStop(0.55, `rgba(41,31,85,${0.09 * visibility})`);
      gradient.addColorStop(1, "rgba(9,7,17,0)");
      context.fillStyle = gradient;
      context.fillRect(0, 120, WIDTH, 1600);

      context.save();
      context.translate(centerX, centerY);
      context.rotate(frameIndex * 0.0009);
      context.globalAlpha = 0.14 * visibility;
      context.strokeStyle = PALETTE.violet;
      context.lineWidth = 2;
      for (let ring = 1; ring <= 5; ring += 1) {
        context.beginPath();
        context.ellipse(0, 0, ring * 105, ring * 145, ring * 0.18, 0, Math.PI * 2);
        context.stroke();
      }
      context.restore();
    }

    function drawCodePlate(alpha, split) {
      if (alpha <= 0) return;
      context.save();
      context.globalAlpha = alpha;

      trackedText("FORM / FIELD", SAFE.x, 294, 46, PALETTE.phase, {
        weight: 600,
        tracking: 2.7
      });
      trackedText("ORIGINAL 005", SAFE.x, 352, 46, PALETTE.quiet, {
        weight: 400,
        tracking: 2.0
      });
      trackedText("273", SAFE.x, 488, 160, PALETTE.paper, {
        family: '"FF Cormorant Garamond", serif',
        style: "italic",
        weight: 600
      });
      trackedText("/ 280", SAFE.x + 300, 482, 58, PALETTE.time, {
        family: '"FF IBM Plex Mono", monospace',
        weight: 400
      });

      codeLines.forEach((line, index) => {
        const direction = index % 2 ? 1 : -1;
        trackedText(line, SAFE.x + direction * split * 150, 556 + index * 50, 38, index === codeLines.length - 1 ? PALETTE.phase : PALETTE.quiet, {
          family: '"FF IBM Plex Mono", monospace',
          weight: 400
        });
      });

      trackedText("THE POINTS MOVE. THE KNOT REMAINS.", SAFE.x, 1100, 46, PALETTE.paper, {
        weight: 600,
        tracking: 0.1
      });
      trackedText("CHRONOPHORE", SAFE.x, 1192, 76, PALETTE.violet, {
        family: '"FF Cormorant Garamond", serif',
        style: "italic",
        weight: 500
      });
      context.restore();
    }

    function drawChronophore(frameIndex, visibility, collapse) {
      if (visibility <= 0) return;
      const time = (frameIndex + 1) * 0.02;
      const scale = 3.34;
      const centerX = 540;
      const centerY = 930;
      const orbitCos = Math.cos(time / 4);
      const orbitSin = Math.sin(time / 4);

      drawPhaseField(frameIndex, visibility);
      context.save();
      context.globalAlpha = visibility;
      context.globalCompositeOperation = "screen";
      context.translate(centerX, centerY);
      context.scale(mix(1, 0.08, collapse), mix(1, 0.52, collapse));
      context.translate(-centerX, -centerY);

      for (let index = 19999; index >= 0; index -= 1) {
        const u = index / 20000 * Math.PI * 2;
        const angle = 2 * u;
        const phase = 3 * u + time;
        const strand = index % 9 / 9 * Math.PI * 2;
        const tube = 28 + 6 * Math.cos(strand);
        const radius = 90 + tube * Math.cos(phase);
        const z = tube * Math.sin(phase) + 6 * Math.sin(strand);
        const x = radius * Math.cos(angle);
        const projectedX = x * orbitCos + z * orbitSin;
        const projectedY = radius * Math.sin(angle);
        const screenX = centerX + projectedX * scale;
        const screenY = centerY + projectedY * scale;
        const red = Math.round(155 + 99 * Math.sin(phase + strand + time));

        context.fillStyle = `rgba(${red},220,255,0.12)`;
        context.fillRect(screenX - 2.1, screenY - 2.1, 4.2, 4.2);
        context.fillStyle = `rgba(${red},220,255,0.58)`;
        context.fillRect(screenX, screenY, 1.45, 1.45);
      }
      context.restore();
    }

    function drawStatement(alpha) {
      if (alpha <= 0) return;
      context.save();
      context.globalAlpha = alpha;
      trackedText("CHRONOPHORE", SAFE.x, 358, 82, PALETTE.violet, {
        family: '"FF Cormorant Garamond", serif',
        style: "italic",
        weight: 500
      });
      trackedText("273", SAFE.x, 684, 260, PALETTE.paper, {
        family: '"FF Cormorant Garamond", serif',
        style: "italic",
        weight: 600
      });
      trackedText("CHARACTERS", SAFE.x, 770, 60, PALETTE.time, {
        weight: 600,
        tracking: 2.1
      });
      trackedText("HOLD", SAFE.x, 950, 74, PALETTE.paper, {
        weight: 600,
        tracking: 1.2
      });
      trackedText("A KNOT IN TIME", SAFE.x, 1038, 74, PALETTE.paper, {
        weight: 600,
        tracking: 0.65
      });
      trackedText("FORM / FIELD ORIGINAL 005", SAFE.x, 1180, 46, PALETTE.phase, {
        weight: 600,
        tracking: 1.45
      });
      context.restore();
    }

    function drawSafeZone() {
      context.save();
      context.fillStyle = "rgba(255,70,90,.17)";
      context.fillRect(0, 0, WIDTH, SAFE.y);
      context.fillRect(0, SAFE.y + SAFE.height, WIDTH, HEIGHT - SAFE.y - SAFE.height);
      context.fillRect(0, SAFE.y, SAFE.x, SAFE.height);
      context.fillRect(SAFE.x + SAFE.width, SAFE.y, WIDTH - SAFE.x - SAFE.width, SAFE.height);
      context.strokeStyle = "rgba(255,255,255,.88)";
      context.lineWidth = 3;
      context.strokeRect(SAFE.x, SAFE.y, SAFE.width, SAFE.height);
      trackedText("TIKTOK UI SAFE ZONE", SAFE.x + 16, SAFE.y + 42, 30, "#fff", {
        family: '"FF IBM Plex Mono", monospace',
        weight: 400
      });
      context.restore();
    }

    function renderFrame(requestedFrame) {
      const frameIndex = Math.round(clamp(Number(requestedFrame), 0, TOTAL_FRAMES - 1));
      context.fillStyle = PALETTE.background;
      context.fillRect(0, 0, WIDTH, HEIGHT);

      const organismVisibility = smoothstep(48, 78, frameIndex) * (1 - smoothstep(374, 402, frameIndex));
      const openingFold = 1 - smoothstep(48, 84, frameIndex);
      const closingFold = smoothstep(374, 402, frameIndex);
      drawChronophore(frameIndex, organismVisibility, Math.max(openingFold, closingFold));

      const openingCode = 1 - smoothstep(40, 70, frameIndex);
      const returningCode = smoothstep(430, 446, frameIndex);
      const codeAlpha = Math.max(openingCode, returningCode);
      const codeSplit = frameIndex < 100
        ? smoothstep(40, 70, frameIndex)
        : 1 - smoothstep(430, 446, frameIndex);
      drawCodePlate(codeAlpha, codeSplit);
      drawStatement(fadeRange(frameIndex, 384, 432, 6));

      if (query.has("safe")) drawSafeZone();
      return frameIndex;
    }

    const requiredFonts = [
      '400 46px "FF Barlow Condensed"',
      '600 46px "FF Barlow Condensed"',
      'italic 500 84px "FF Cormorant Garamond"',
      '400 38px "FF IBM Plex Mono"'
    ];

    Promise.all(requiredFonts.map(font => document.fonts.load(font))).then(() => {
      window.__renderFrame = renderFrame;
      if (!query.has("deterministic")) {
        const previewFrame = Math.min(TOTAL_FRAMES - 1, Number(query.get("frame") || 232));
        renderFrame(previewFrame);
      }
      window.__videoReady = true;
    });
  </script>
</body>
</html>
